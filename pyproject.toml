[project]
name = "safevision-backend"
version = "2.0.0"
description = "Backend de SafeVision AI: API REST para eventos y alertas de seguridad."
readme = "README.md"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["app", "safevision"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires a PostgreSQL test database (TEST_DATABASE_URL)",
]
