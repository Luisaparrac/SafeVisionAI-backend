services:
  - type: web
    name: safevision-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn safevision.adapters.inbound.http.app:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        sync: false
      - key: IOT_API_KEY
        generateValue: true
      - key: SESSION_SECRET
        sync: false
      - key: SESSION_COOKIE_SAMESITE
        value: none
      - key: FRONTEND_ORIGINS
        sync: false
      - key: TIMEZONE
        value: America/Bogota
