services:
  - type: web
    name: safevision-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DATABASE_URL
        fromDatabase:
          name: safevision-db
          property: connectionString
      - key: IOT_API_KEY
        generateValue: true
      - key: FRONTEND_ORIGINS
        sync: false
      - key: TIMEZONE
        value: America/Bogota
      - key: SEED_DEMO_EVENTS
        value: "true"

databases:
  - name: safevision-db
    plan: free
    databaseName: safevision
    user: safevision
