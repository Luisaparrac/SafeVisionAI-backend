name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Throwaway credentials that only exist inside this job.
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: safevision_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d safevision_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/safevision_test
      REQUIRE_TEST_DATABASE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Tests (unit, contract and integration)
        run: pytest
      - name: Smoke test of the render.yaml start command
        run: pytest -m smoke
